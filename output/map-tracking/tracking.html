<!-- Long-running console (v1.1):
 1. Console at the top: five numbers (needs you / new replies / recently changed / in progress / waiting); click one to list its items, click an item to jump to the node; the map can be filtered to one kind.
 2. Recently changed: build.py gives every node a content fingerprint; the page compares it with the snapshot of what you last looked at (kept in localStorage) and marks nodes New / Edited; collapsed nodes with changes below get a dot next to "+N".
 3. Replies = one-line summary + status label + expandable details + related nodes. Old replies without these fields use the first sentence as the summary. The right panel is ordered: needs you, new replies, waiting for a reply, handled (folded by date). A new reply counts as read once it has been visible in the panel for 2 seconds. The 💬 on a node shows a count, with a red dot for unread replies or open questions.
 4. The root title may change with the update time (meta.root_key is its fixed name inside node paths, so old quotes stay valid); the branch named by meta.now takes no colour slot, is expanded by default and shows its notes.
 5. Status tag [NEEDS-YOU]; zoom buttons are a floating bar at the bottom left; the legend sits behind a button; a page left open reads .stamp.js when you return to the tab and offers a refresh when there is a newer build; expansion, filter, selection and zoom live in sessionStorage so a refresh keeps your place.
 6. Feedback already pulled into _fb/ is embedded (KNOWN), so another browser still shows your words, quotes and replies.
 7. v1.2: meta.use (learning / project tracking / decision) shows in the header; a quote or reply that points at a node which moved but kept its title is found by its last title (findKey), when exactly one node has that title.
 localStorage namespace mm:<id>: unchanged; new keys: read (read replies), answered (handled questions), snap/snapTs (snapshot for "recently changed"), del (items you deleted). -->
<style>
:root{
  --bg:#f6f7f9; --ink:#1f2328; --muted:#6a737d; --line:#c9ced6; --panel:#fff; --fbw:400px; --q:#fb8500;
  --done:#1a7f37; --run:#0969da; --todo:#9a6700; --bad:#cf222e; --stop:#6e7781; --wait:#8250df; --decided:#116329; --risk:#bc4c00; --idea:#0550ae;
  --ask:#d6336c; --chg:#4f46e5; --unread:#e5484d;
}
body.fbc{--fbw:38px}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;overflow:hidden}
header{position:relative;z-index:5;background:#fff;border-bottom:1px solid #e1e4e8;padding:8px 16px 8px;margin-right:var(--fbw)}
.hrow{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
h1{font-size:17px;margin:0}
.age{font-size:12px;color:var(--muted)}
.hlink{font-size:12px;color:var(--muted);cursor:pointer;border:none;background:none;padding:0;text-decoration:underline dotted}
.hlink:hover{color:var(--run)}
.meta{color:var(--muted);font-size:12px;margin:2px 0 0;display:none}
.meta.open{display:block}
#newver{display:none;margin-left:auto;border:1px solid #f5c26b;background:#fff4d6;color:#7a4b00;border-radius:12px;padding:1px 10px;font-size:12px;cursor:pointer}
#newver.on{display:inline-block}
/* Console */
#cons{display:flex;gap:8px;flex-wrap:wrap;align-items:stretch;margin-top:7px}
.chip{display:flex;align-items:center;gap:7px;border:1px solid #d0d7de;background:#fff;border-radius:10px;padding:5px 12px 5px 10px;cursor:pointer;font-size:13px;color:var(--ink);min-width:0}
.chip:hover{background:#f6f8fa}
.chip.on{box-shadow:0 0 0 2px #b6d4fe;border-color:#54aeff;background:#f1f8ff}
.chip b{font-size:18px;line-height:1;font-weight:700;min-width:12px;text-align:center}
.chip .lb{font-size:12.5px;color:#444;white-space:nowrap}
.chip i.dot{width:9px;height:9px;border-radius:50%;flex:none;background:#9aa3ad}
.chip.zero b{color:#8c959f;font-weight:500}
.chip.c-ask.hot{border-color:var(--ask);background:#fff0f6}.chip.c-ask i.dot{background:var(--ask)}.chip.c-ask.hot b{color:var(--ask)}
.chip.c-new.hot{border-color:#ff9aa0;background:#fff3f3}.chip.c-new i.dot{background:var(--unread)}.chip.c-new.hot b{color:var(--unread)}
.chip.c-chg.hot{border-color:#a5a0f5;background:#f3f2ff}.chip.c-chg i.dot{background:var(--chg)}.chip.c-chg.hot b{color:var(--chg)}
.chip.c-doing i.dot{background:var(--run)}.chip.c-wait i.dot{background:var(--wait)}
.chip .sub{font-size:11px;color:var(--muted);white-space:nowrap}
.chip.c-next i.dot{background:#0a7f8f}
.chip.c-next .tm{font-size:15px;min-width:0;color:#0a6270}
.chip.c-next .lb{max-width:230px;overflow:hidden;text-overflow:ellipsis}
.bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:7px}
.bar input{flex:1 1 180px;min-width:150px;max-width:300px;padding:5px 10px;border:1px solid #d0d7de;border-radius:6px;font-size:14px}
.bar button{padding:4px 9px;border:1px solid #d0d7de;background:#f6f8fa;border-radius:6px;cursor:pointer;font-size:13px;color:var(--ink)}
.bar button:hover{background:#eef1f4}
.bar button.on{background:#ddf4ff;border-color:#54aeff}
.bar .sep{width:1px;height:20px;background:#d0d7de;margin:0 2px}
.bar .flt{display:inline-flex;gap:4px;align-items:center;font-size:12px;color:var(--muted)}
.bar .flt button.on{background:#fff0f6;border-color:var(--ask)}
.hits{font-size:12px;color:var(--muted);min-width:60px}
#fbanner{display:none;margin-top:6px;font-size:12.5px;background:#fff8c5;border:1px solid #eac54f;border-radius:6px;padding:3px 10px;color:#5a4400}
#fbanner.on{display:block}
#fbanner a{color:var(--run);cursor:pointer;margin-left:8px;text-decoration:underline}
.legend{display:none;flex-wrap:wrap;gap:6px;margin-top:6px;font-size:12px;color:var(--muted)}
.legend.open{display:flex}
/* List opened from a console number */
#pop{position:fixed;display:none;z-index:15;width:540px;max-width:calc(100vw - var(--fbw) - 28px);max-height:62vh;overflow:auto;background:#fff;border:1px solid #c9d1d9;border-radius:10px;box-shadow:0 10px 32px rgba(0,0,0,.18)}
#pop.open{display:block}
#pop .ph{position:sticky;top:0;background:#fff;border-bottom:1px solid #eaeef2;padding:8px 12px;display:flex;gap:8px;align-items:center;z-index:1}
#pop .ph b{font-size:14px}
#pop .ph .hint{font-size:12px;color:var(--muted);flex:1}
#pop .ph button{border:1px solid #d0d7de;background:#f6f8fa;border-radius:6px;padding:2px 9px;cursor:pointer;font-size:12px;color:var(--ink)}
#pop .ph button:hover{background:#eef1f4}
#pop .none{padding:14px 14px;color:#57606a;font-size:13px}
.ci{padding:8px 12px;border-bottom:1px solid #f0f2f5;cursor:pointer}
.ci:hover{background:#f6f8fa}
.ci.cur{background:#eef4ff}
.ci .ct{font-weight:600}
.ci .cp{font-size:11.5px;color:var(--muted);margin-top:1px}
.ci .cn{font-size:12.5px;color:#444;margin-top:3px;white-space:pre-wrap;word-break:break-word}
.ci .mk{margin-left:0;margin-right:5px}
/* Canvas: drag or two-finger swipe to pan, pinch or Ctrl/Cmd+wheel to zoom */
#stage{position:absolute;top:var(--hh,130px);left:0;right:var(--fbw);bottom:0;overflow:hidden;cursor:grab;user-select:none;-webkit-user-select:none;touch-action:none}
#stage.drag{cursor:grabbing}
#map{position:absolute;left:0;top:0;transform-origin:0 0;padding:24px 40px 80px 24px;width:max-content;will-change:transform}
#map.anim{transition:transform .35s ease}
#zc{position:fixed;left:12px;bottom:12px;z-index:6;display:flex;gap:2px;background:#fff;border:1px solid #d0d7de;border-radius:8px;padding:3px;box-shadow:0 2px 8px rgba(0,0,0,.1)}
#zc button{border:none;background:none;border-radius:5px;padding:3px 9px;cursor:pointer;font-size:13px;color:var(--ink)}
#zc button:hover{background:#eef1f4}
body.outline #zc{display:none}
/* Tree connectors */
.branch{position:relative;display:flex;align-items:center}
.children{position:relative;display:flex;flex-direction:column;padding-left:26px}
.children::before{content:"";position:absolute;left:0;top:50%;width:26px;border-top:1.5px solid var(--line)}
.children>.branch{padding:3px 0 3px 18px}
.children>.branch::before{content:"";position:absolute;left:0;top:50%;width:18px;border-top:1.5px solid var(--line)}
.children>.branch::after{content:"";position:absolute;left:0;top:0;bottom:0;border-left:1.5px solid var(--line)}
.children>.branch:first-child::after{top:50%}
.children>.branch:last-child::after{bottom:50%}
.children>.branch:only-child::after{display:none}
.collapsed>.children{display:none}
.fhide{display:none!important}
/* Nodes */
.node{position:relative;max-width:360px;padding:5px 10px;border-radius:8px;background:#fff;border:1px solid hsl(var(--h),45%,72%);cursor:pointer;box-shadow:0 1px 1px rgba(0,0,0,.04)}
.node:hover{box-shadow:0 0 0 2px hsl(var(--h),70%,80%)}
.d0>.node{background:#24292f;color:#fff;border:none;font-size:17px;font-weight:700;padding:10px 16px;max-width:240px}
.d1>.node{background:hsl(var(--h),58%,44%);color:#fff;border:none;font-weight:600;font-size:15px;padding:7px 12px}
.d2>.node{background:hsl(var(--h),70%,95%);border-left:4px solid hsl(var(--h),58%,50%);font-weight:500}
.d3>.node{max-width:380px}
.node.sel{outline:2.5px solid var(--q);outline-offset:1px}
.node.flash{animation:flash 1.2s ease 1}
@keyframes flash{0%{box-shadow:0 0 0 0 rgba(251,133,0,.9)}40%{box-shadow:0 0 0 8px rgba(251,133,0,.35)}100%{box-shadow:0 0 0 0 rgba(251,133,0,0)}}
.node .t{white-space:normal;word-break:break-word}
.node .more{display:none;margin-left:6px;font-size:11px;padding:0 6px;border-radius:9px;background:hsl(var(--h),40%,90%);color:hsl(var(--h),50%,30%);font-weight:600}
.d1>.node .more{background:rgba(255,255,255,.25);color:#fff}
.collapsed>.node .more{display:inline-block}
.node .ni{display:inline-block;margin-left:4px;font-size:11px;color:hsl(var(--h),50%,45%)}
.d1>.node .ni,.d0>.node .ni{color:#fff;opacity:.8}
.note{display:none;margin-top:4px;padding-top:4px;border-top:1px dashed hsl(var(--h),40%,82%);font-size:12px;color:#444;font-weight:400}
.d1>.node .note,.d0>.node .note{color:#f0f0f0;border-top-color:rgba(255,255,255,.4)}
body.shownotes .note{display:block}
body.shownotes .node .ni{display:none}
.qbtn{display:none;position:absolute;right:-11px;top:-11px;width:24px;height:24px;border-radius:50%;background:var(--q);color:#fff;font-size:12px;line-height:20px;text-align:center;border:2px solid #fff;cursor:pointer;z-index:2;box-shadow:0 1px 4px rgba(0,0,0,.25)}
.node:hover>.qbtn{display:block}
.qbtn:hover{transform:scale(1.15)}
.fbn{display:inline-block;margin-left:5px;padding:0 6px;border-radius:9px;font-size:11px;line-height:17px;background:var(--q);color:#fff;font-weight:600;vertical-align:1px;position:relative}
.fbn:empty{display:none}
.fbn.hot::after{content:"";position:absolute;right:-3px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--unread);border:1.5px solid #fff}
.mk{display:none;margin-left:5px;padding:0 6px;border-radius:9px;font-size:11px;line-height:17px;background:var(--chg);color:#fff;vertical-align:1px;font-weight:600}
.mk.on{display:inline-block}
.sd{display:none}
.collapsed>.node .sd:not(:empty){display:inline-flex;gap:2px;margin-left:4px;vertical-align:1px}
.sd i{width:8px;height:8px;border-radius:50%;border:1.5px solid #fff;box-shadow:0 0 0 .5px rgba(0,0,0,.25)}
.sd i.d-ask{background:var(--ask)}.sd i.d-unread{background:var(--unread)}.sd i.d-chg{background:var(--chg)}
.tag{display:inline-block;margin-left:5px;padding:0 6px;border-radius:9px;font-size:11px;line-height:17px;color:#fff;vertical-align:1px;font-weight:500}
.tag-active,.tag-done{background:var(--done)}
.tag-doing{background:var(--run)}
.tag-todo{background:var(--todo)}
.tag-issue{background:var(--bad)}
.tag-stopped{background:var(--stop)}
.tag-waiting{background:var(--wait)}
.tag-decided{background:var(--decided)}
.tag-risk{background:var(--risk)}
.tag-proposal{background:var(--idea)}
.tag-needs-you{background:var(--ask);font-weight:700}
/* Search */
body.searching .node{opacity:.28}
body.searching .node.hit,body.searching .node.path{opacity:1}
.node.hit{box-shadow:0 0 0 3px #ffd33d}
.node.cur{box-shadow:0 0 0 3px var(--q)}
/* Outline view */
#outline{display:none;position:absolute;top:var(--hh,130px);left:0;right:var(--fbw);bottom:0;overflow:auto;padding:12px 16px 60px}
body.outline #stage{display:none}
body.outline #outline{display:block}
#outline details{margin:2px 0 2px 0}
#outline details details,#outline .leaf{margin-left:18px}
#outline summary{cursor:pointer;padding:2px 0}
#outline .leaf{padding:2px 0 2px 14px;position:relative}
#outline .leaf::before{content:"•";position:absolute;left:2px;color:var(--muted)}
#outline .on{font-size:12px;color:#555;margin:1px 0 3px 14px}
#outline .os{font-size:11px;color:var(--muted);margin:0 0 3px 14px;word-break:break-all}
#outline .lv1>summary{font-weight:700;font-size:15px;color:hsl(var(--h),58%,36%)}
#outline .hit{background:#fff8c5}
#outline [data-oid]{cursor:pointer}
#outline .oq{visibility:hidden;cursor:pointer;margin-left:6px;font-size:12px;padding:0 6px;border-radius:9px;background:var(--q);color:#fff}
#outline summary:hover>.oq,#outline .leaf:hover>.oq{visibility:visible}
/* Right panel: details of the selected node + feedback */
#fb{position:fixed;top:0;right:0;bottom:0;width:var(--fbw);background:#fff;border-left:1px solid #d0d7de;display:flex;flex-direction:column;z-index:7;box-shadow:-2px 0 8px rgba(0,0,0,.04)}
#fb .rz{position:absolute;left:-4px;top:0;bottom:0;width:8px;cursor:col-resize;z-index:2}
#fb .fh{display:flex;align-items:center;gap:8px;padding:10px 12px 9px;border-bottom:1px solid #eaeef2;flex:none}
#fb .fh b{font-size:15px}
#fb .conn{font-size:12px;color:var(--muted)}
#fb .conn.ok::before{content:"● ";color:var(--done)}
#fb .conn.bad{color:var(--bad)}
#fb .conn.bad::before{content:"● "}
#fb .conn a{color:var(--run)}
#fb .fold{margin-left:auto;border:1px solid #d0d7de;background:#f6f8fa;border-radius:6px;cursor:pointer;font-size:12px;padding:2px 8px;color:var(--ink)}
#fb .fv{display:none;flex:1;cursor:pointer;writing-mode:vertical-rl;text-align:center;padding:14px 0;font-size:14px;color:var(--ink);letter-spacing:4px;align-items:center;justify-content:flex-start}
#fb .fv:hover{background:#f6f8fa}
html[lang="en"] #fb .fv{letter-spacing:1px}
#fb .fv i{font-style:normal;writing-mode:horizontal-tb;display:inline-block;margin-top:8px;background:var(--unread);color:#fff;border-radius:9px;font-size:11px;padding:0 5px;letter-spacing:0}
body.fbc #fb>*:not(#panel):not(.fv){display:none}
body.fbc #fb .fv{display:flex}
/* Details (top of the right panel; floats over the canvas when the panel is folded) */
#panel{display:none;flex:none;max-height:34%;overflow:auto;padding:10px 14px 10px;border-bottom:1px solid #eaeef2;background:#fbfcfd;position:relative}
#panel.open{display:block}
body.fbc #panel.open{position:fixed;right:calc(var(--fbw) + 12px);top:calc(var(--hh,130px) + 10px);width:360px;max-height:calc(100% - var(--hh,130px) - 24px);border:1px solid #d0d7de;border-radius:10px;box-shadow:0 6px 24px rgba(0,0,0,.12);background:#fff}
#panel .crumb{font-size:12px;color:var(--muted);margin:0 22px 6px 0}
#panel .crumb a{color:var(--muted);cursor:pointer;text-decoration:none}
#panel .crumb a:hover{text-decoration:underline}
#panel h2{font-size:15px;margin:0 0 6px}
#panel .pq{margin:2px 0 4px;border:1px solid var(--q);background:#fff8f0;color:#b45309;border-radius:6px;padding:2px 10px;font-size:12px;cursor:pointer}
#panel .pq:hover{background:#ffedd5}
#panel .pn{white-space:pre-wrap;margin:6px 0}
#panel .ps{font-size:12px;color:var(--muted);background:#f6f8fa;border-radius:6px;padding:6px 8px;word-break:break-all;margin:6px 0}
#panel ul{margin:6px 0;padding-left:18px}
#panel li{margin:2px 0;cursor:pointer}
#panel li:hover{color:var(--run)}
#panel .x{position:absolute;right:8px;top:6px;border:none;background:none;font-size:18px;cursor:pointer;color:var(--muted)}
#panel .pth{margin:8px 0 2px;font-size:12px;color:var(--muted)}
#panel .pt{display:flex;gap:6px;align-items:flex-start;padding:3px 0;cursor:pointer;font-size:13px}
#panel .pt:hover{color:var(--run)}
/* Feedback list */
#fbl{flex:1;overflow:auto;padding:6px 10px 20px;min-height:90px;background:#f3f5f8}
#fbl .empty{font-size:13px;color:#57606a;background:#fff;border:1px dashed #d0d7de;border-radius:8px;padding:10px 12px;margin-top:6px}
#fbl .empty p{margin:0 0 6px}
#fbl .empty p:last-child{margin:0}
.sec{margin:4px 0 10px}
.sh{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;color:#3d444d;padding:6px 2px 5px;position:sticky;top:-6px;background:#f3f5f8;z-index:2}
.sh .c{background:#d0d7de;color:#333;border-radius:9px;padding:0 7px;font-size:11px;font-weight:600}
.sh .sa{margin-left:auto;font-weight:400;font-size:11.5px;color:var(--muted);cursor:pointer}
.sh .sa:hover{color:var(--run);text-decoration:underline}
.sec.ask>.sh{color:#a61e55}.sec.ask>.sh .c{background:var(--ask);color:#fff}
.sec.new>.sh{color:#0550ae}.sec.new>.sh .c{background:var(--run);color:#fff}
.sech{font-size:11.5px;color:var(--muted);margin:-2px 2px 6px}
.th{background:#fff;border:1px solid #e1e4e8;border-radius:8px;margin-bottom:7px;overflow:hidden}
.th.isnew{border-left:4px solid var(--run)}
.th.isask{border-left:4px solid var(--ask)}
.th.iswait{border-style:dashed}
.th.seen{border-left-color:#c9ced6}
.th>summary{list-style:none;cursor:pointer;padding:7px 10px;display:flex;gap:7px;align-items:flex-start}
.th>summary::-webkit-details-marker{display:none}
.th>summary:hover{background:#fafbfc}
.th>summary .sm{flex:1;font-weight:600;line-height:1.45;word-break:break-word}
.th>summary .tm{flex:none;font-size:11px;color:#8c959f;white-space:nowrap;margin-top:2px}
.th[open]>summary{border-bottom:1px solid #eef0f3}
.ct .st{margin-right:6px}
.st{flex:none;display:inline-block;padding:0 7px;border-radius:9px;font-size:11px;line-height:18px;color:#fff;font-weight:600;background:#8c959f;margin-top:1px}
.st-done{background:var(--done)}
.st-doing{background:var(--run)}
.st-planned{background:var(--todo)}
.st-dropped{background:var(--stop)}
.st-needs-you{background:var(--ask)}
.st-pending{background:#8c959f}
.nw{flex:none;font-size:10.5px;line-height:16px;padding:0 5px;border-radius:8px;background:var(--unread);color:#fff;font-weight:700;margin-top:2px}
.th.seen .nw{display:none}
.th .body{padding:8px 10px 9px}
.you{font-size:12.5px;color:#444;margin:0 0 7px}
.you .lb{display:inline-block;font-size:11px;color:#fff;background:#8c959f;border-radius:4px;padding:0 5px;margin-right:5px;line-height:16px}
.you .yt{white-space:pre-wrap;word-break:break-word;max-height:4.6em;overflow:hidden;position:relative;cursor:pointer}
.you .yt.fade::after{content:"";position:absolute;left:0;right:0;bottom:0;height:1.4em;background:linear-gradient(rgba(255,255,255,0),#fff)}
.you .yt.exp{max-height:none}
.you .yt.exp::after{display:none}
.you .more{font-size:11px;color:var(--run);cursor:pointer}
.ai{margin:6px 0 4px;padding:7px 9px;background:#f3f9ff;border-radius:6px;border:1px solid #d9ebfb}
.ai.ask{background:#fff4f8;border-color:#f6c5d8}
.ai .ah{display:flex;gap:6px;align-items:baseline;flex-wrap:wrap;font-size:11px;color:#57606a}
.ai .ah b.sm{font-size:13.5px;color:var(--ink);flex:1 1 100%;order:3;line-height:1.5;margin-top:3px;word-break:break-word}
.ai .askq{margin-top:5px;font-size:13px;color:#8a1745;font-weight:600;white-space:pre-wrap;word-break:break-word}
.ai details.dt{margin-top:5px}
.ai details.dt>summary{cursor:pointer;font-size:12px;color:var(--run);list-style:none}
.ai details.dt>summary::-webkit-details-marker{display:none}
.ai details.dt>summary::before{content:"▸ ";}
.ai details.dt[open]>summary::before{content:"▾ ";}
.ai .dtx{margin-top:4px;font-size:13px;white-space:pre-wrap;word-break:break-word;color:#24292f}
.ncs{margin-top:6px;display:flex;flex-wrap:wrap;gap:4px}
.nc{font-size:11.5px;background:#fff;border:1px solid #d0d7de;border-radius:10px;padding:0 8px;cursor:pointer;color:#0550ae;line-height:18px}
.nc:hover{background:#eef4ff}
.qb{border-left:3px solid var(--q);background:#fff8f0;padding:3px 8px;margin:4px 0;font-size:12px;border-radius:0 6px 6px 0;cursor:pointer;word-break:break-word}
.qb:hover{background:#ffedd5}
.qb .qp{color:#8c959f;font-size:11px}
.ft{display:flex;gap:10px;font-size:11.5px;color:var(--muted);margin-top:6px;align-items:center}
.ft .act{cursor:pointer;color:var(--muted)}
.ft .act:hover{color:var(--bad);text-decoration:underline}
.ft .act.pri{color:#a61e55;font-weight:600}
.ft .act.pri:hover{color:var(--ask)}
.ft .grow{flex:1}
.fs{font-size:11.5px;color:var(--muted);margin-top:4px}
.fs.seen{color:var(--done)}
.fs.warn{color:#9a6700}
.fc{font-size:11px;color:#8c959f}
.ndcard{background:#fff;border:1px solid #f1c2d5;border-left:4px solid var(--ask);border-radius:8px;margin-bottom:7px;padding:8px 10px;cursor:pointer}
.ndcard .ct{font-weight:600}
.ndcard .cn{font-size:12.5px;color:#444;margin-top:3px;white-space:pre-wrap;word-break:break-word}
.dg{margin-bottom:6px}
.dg>summary{cursor:pointer;font-size:12px;color:#57606a;padding:4px 2px;list-style:none;font-weight:600}
.dg>summary::-webkit-details-marker{display:none}
.dg>summary::before{content:"▸ ";color:#8c959f}
.dg[open]>summary::before{content:"▾ "}
.th.flashth{animation:flashth 1.4s ease 1}
@keyframes flashth{0%,100%{box-shadow:0 0 0 0 rgba(251,133,0,0)}30%{box-shadow:0 0 0 4px rgba(251,133,0,.5)}}
/* Feedback input */
#fbc{flex:none;border-top:1px solid #d0d7de;padding:8px 10px 10px;background:#fff}
#fbq .qc{display:flex;gap:6px;align-items:flex-start;margin-bottom:5px}
#fbq .qc .qb{flex:1;margin:0}
#fbq .qc .x{cursor:pointer;color:var(--muted);font-size:15px;line-height:20px;padding:0 2px}
#fbq .qc .x:hover{color:var(--bad)}
#fbq .re{display:flex;gap:6px;align-items:flex-start;margin-bottom:5px;font-size:12px;background:#fff4f8;border:1px solid #f6c5d8;border-radius:6px;padding:3px 8px;color:#8a1745}
#fbq .re .x{margin-left:auto;cursor:pointer;color:var(--muted)}
#fbt{width:100%;min-height:70px;max-height:40vh;resize:none;border:1px solid #d0d7de;border-radius:8px;padding:8px 10px;font:inherit;font-size:14px;line-height:1.5;outline:none}
#fbt:focus{border-color:#54aeff;box-shadow:0 0 0 3px rgba(84,174,255,.25)}
#fbc .row{display:flex;align-items:center;gap:8px;margin-top:6px}
#fbc .hint{font-size:11px;color:var(--muted);flex:1}
#fbc button{border-radius:6px;cursor:pointer;font-size:13px;padding:5px 12px}
#fbs{background:#1f883d;color:#fff;border:1px solid #1a7f37}
#fbs:hover{background:#1a7f37}
#fbn{background:#f6f8fa;color:var(--ink);border:1px solid #d0d7de}
#fbn:disabled{color:#8c959f;cursor:default}
#selq{position:fixed;display:none;z-index:20;background:#24292f;color:#fff;border-radius:6px;padding:4px 10px;font-size:12px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.25)}

#fbc .hint a{color:var(--muted)}

#cpm{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;z-index:40;align-items:center;justify-content:center}

#cpm .box{background:#fff;border-radius:10px;padding:14px 16px;width:min(640px,90vw)}
#cpm p{margin:6px 0;font-size:13px;color:#57606a}
#cpm textarea{width:100%;height:46vh;font:12px/1.5 ui-monospace,Menlo,monospace;border:1px solid #d0d7de;border-radius:6px;padding:8px}
#cpm .row{display:flex;gap:8px;justify-content:flex-end;margin-top:8px}
#cpm button{border:1px solid #d0d7de;background:#f6f8fa;border-radius:6px;padding:5px 12px;cursor:pointer}
#cpm #cpok{background:#1f883d;color:#fff;border-color:#1a7f37}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#24292f;color:#fff;padding:6px 14px;border-radius:8px;font-size:13px;z-index:30;display:none}

: "7426d044"}], "f": "d8baaff1"}, {"t": "目的与蓝图", "n": "业主 2026-10-18 的定调：先把正向流程的细节做好，第一标准是能复现论文", "g": [], "s": "", "c": [{"t": "第一标准没有变：正向流程能跑通", "n": "一条命令，从建结构一路走到出报告，可选能力默认关闭，默认路径逐位不变。这条标准本来就在计划第 10 节里，2026-10-18 没有改", "g": ["decided"], "s": "plan.md 第 10 节", "c": [], "f": "12089464"}, {"t": "论文复现是这条标准的证据，不是新的标准", "n": "业主原话：「第一标准还是流程跑通 论文复现只是证明这套正向流程能被跑通」。所以两者是**两个不同的说法**：一条腿跑通了流程，不等于它复现了论文。**每条腿必须说清自己在声称哪一个**", "g": ["decided"], "s": "plan.md 第 10 节", "c": [], "f": "dbdd3fb6"}, {"t": "论文不是权威，只是参考", "n": "业主 2026-10-18 原话：「论文的结论也不一定准确」。所以「我们和论文不一样」**不自动等于我们错**。任何与论文的差异都要先归因（是读数口径、是物理、还是论文本身），再下结论。**反面禁止**：把「对上论文」当成正确性的证据", "g": ["decided"], "s": "plan.md 第 10 节", "c": [], "f": "649dbda8"}, {"t": "眼下的质量锚是物理检验，不是论文", "n": "业主原话：「暂时先跑通物理学检验 保证我们的结论是经得起推敲的」。物理检验＝从物理本身来的判据，不是从别的程序或论文抄来的：能量守恒、无源性、解析闭式解对照、收敛阶、单位与归一化账本。**这五样已经建好了**（第 2 到第 5 条腿）", "g": ["decided"], "s": "plan.md 第 9 节、docs/leg2 到 leg5", "c": [{"t": "覆盖率已经数清了：25 个物理量里 8 个有通过的检验，缺口剩 1 个", "n": "第 11 条腿数了 33 次运行、2062 个数字、96 类字段，当时是 4 个有检验、2 个有检验但没生效、13 个没检查、8 个不是缺口。第 12、13、14 条腿做完后重数：读 40 个运行、106 类字段，**未覆盖剩 1 个**（`zero_order_forward_power`）", "g": ["done"], "s": "docs/leg11-2026-10-18.md; src/coverage_audit.py", "c": [], "f": "04e98837"}], "f": "502668d2"}, {"t": "近期的工就是正向流程的细节", "n": "登记的第一波：M1 齿宽网格收敛、M2 采用 20/20 网格、M3 显存准入模型、M5 细网格一次、S3 监视器审计与 S4 读数归一化账本。其中 M1 与 M2 不需要求解器授权", "g": ["decided"], "s": "plan.md 第 6 节 Wave 1", "c": [], "f": "ec830219"}, {"t": "逆设计整条轨道降级", "n": "保留登记、不取消，但近期不占工。它的三项前置选择因此不再是现在要您回答的事", "g": ["decided"], "s": "plan.md 第 10 节", "c": [], "f": "55494492"}, {"t": "挡着「复现成功」这句话的是两件事", "n": "**不挡干活，只挡下结论。** 第一件：复现的达标线还没定（您有意搁置）。第二件：**论文的结论本身不一定准确**——所以就算对上了也不构成正确性的证据。原来的第三件（辐射强度高约 40%，归因未定）在第 13 条腿里结了：材料把它归到前任项目那个独立的 FDTD 实现上，参考项目 2026-10-13 已自行撤回这个说法；而 N8 是 8 个周期，不是衰减长度，本仓库里没有任何数字量这个 `alpha`。结论：现在每条腿只能写「流程跑通了，结果是这样」，不能写「复现了论文」", "g": ["issue"], "s": "plan.md 第 3 节 S4、第 10 节; docs/leg13-2026-10-18.md", "c": [], "f": "57f60594"}, {"t": "更远的完成定义不变", "n": "三条同时成立才算做完：正向流程端到端一条命令、逆向流程端到端、验  [], "f": "79a82423"}], "f": "ad2260c1"}, {"t": "优先一：让「已验证」这个词覆盖更多数字", "n": "", "g": [], "s": "", "c": [{"t": "引导夹具上的数字全部只是「一致」", "n": "N8 与 G8 两个导向夹具上的透射、反射、目标值、上行功率、入射功率，都只是复现本项目自己的历史输出；没有任何解析算例覆盖它们。所以这几个数字目前没有一个可以被叫作已验证。这是诚实状态，不是缺陷，但它意味着**眼下还没有一个器件级的数字能当依据**", "g": ["issue"], "s": "STATUS.md", "c": [], "f": "81951a72"}, {"t": "解析算例的覆盖范围很窄", "n": "现有的解析定律只覆盖垂直入射的真空与介质界面、以及一块无损非色散平板。斜入射、多层、色散介质、有损介质、平板波导模式、球体散射、光栅单级次效率，都没有对应的解析算例", "g": ["issue"], "s": "src/analytic_cases.py", "c": [], "f": "018c589c"}, {"t": "优先补光栅单级次效率的解析案例", "n": "理由：本项目对标的是光栅耦合器，而光栅单级次效率有现成的解析或半解析对照（例如耦合模与严格耦合波）。补上它，器件级数字才有可能从「一致」升到「已验证」", "g": ["proposal"], "s": "本图「轨道 V 验证框架」分支", "c": [], "f": "1456c50a"}], "f": "4e76804f"}, {"t": "优先二：把最大的那项不确定压下去", "n": "", "g": [], "s": "", "c": [{"t": "读数归一化的 5.6 个百分点是目前最大的单项不确定", "n": "过渡区的损耗与厂商差 5.6 个百分点；辐射强度比论文设计高约 40%；论文归一化到哪个面、哪个跨度，从正文无法判定。这正是 S4（读数归一化账本）存在的理由，而 S4 在关键路径上", "g": ["issue"], "s": "plan.md 第 3 节 S4", "c": [], "f": "795b37d5"}, {"t": "先做 S4 再做任何器件级对比", "n": "理由：在归一化口径没定之前，任何「我们和厂商差多少」的数字都带着这 5.6 个百分点，比较的结论不可用", "g": ["proposal"], "s": "本图「轨道 V」与 STATUS.md", "c": [], "f": "7bb2a3a1"}], "f": "448a98d6"}, {"t": "优先三：文档与目录的真相源", "n": "", "g": [], "s": "", "c": [{"t": "派生文档落后已经被抓到两次", "n": "第一次是 README 顶部的状态行停在「第 1 条腿进行中」；第二次是 AGENTS.md 指向已经改名的目录。两次都是 10-18 发现并当场修好的。机制：`plan.md` 已写明「报告那一步重生成 STATUS.md，并顺手更新本图」", "g": ["done"], "s": "README.md、AGENTS.md、plan.md 第 0.1 节", "c": [], "f": "6af026a7"}, {"t": "求解器仓库是浅克隆", "n": "克隆时报告 source repository is shallow，历史被截断。冻结的副本继承了这一点。工作树和文件清单是完整的，只有深层历史缺失；这**不影响**逐位比对（比对用的是文件清单，不是历史）", "g": ["risk"], "s": "PROVENANCE.md", "c": [], "f": "9400cb55"}, {"t": "三个目录的分工目前只靠约定，没有自动检查", "n": "output 只放给业主看的、docs 放证据、scratch 放机器输出——这条规则写在 README 里，没有任何东西在检查它。可以考虑让周复盘的快照顺手核对一次", "g": ["proposal"], "s": "README.md", "c": [], "f": "0c26d4a9"}], "f": "e11d2b09"}], "f": "01a53255"}, {"t": "关于这张图", "n": "", "g": [], "s": "", "c": [{"t": "怎么生成的", "n": "主干和「现在」七节由主会话自己写。「轨道 M 与轨道 O」「轨道 V 与轨道 I」「机器与流程与数据放在哪与发展历程」三条细节分支，派了三个只读子代理分头调研，报告回来后由主会话回源核对、改写、并入", "g": [], "s": "本次会话", "c": [], "f": "5eda0dfa"}, {"t": "哪些回源核过", "n": "关键的「做没做」状态都回原始文件核过：Q6 授权与冻结（对照 `AGENTS.md` 授权日志与 `PROVENANCE.md`）、十条腿的判决（对照 `docs/` 与 `runs/ledger.jsonl`）、求解器与参考项目的固定提交（对照 `PROVENANCE.md`）。子代理报告里凡与原件不符的，以原件为准", "g": [], "s": "本图各节点", "c": [], "f": "6bedecaa"}, {"t": "哪些只是转述", "n": "各条腿的判据、成本、停止条件是转述 `plan.md` 的原文，本次没有重跑任何仿真。收敛阶数、角度漂移代价、纤维重叠效率、真二维对假二维的差值都是引用历史结果", "g": [], "s": "docs/", "c": [], "f": "6e2d33bc"}, {"t": "怎么给它提意见", "n": "在页面上选中某个节点或某句话写下想法，点「复制给 AI」贴回对话；或者直接对 agent 说「去看反馈」，它会从浏览器里取", "g": [], "s": "SKILL.md", "c": [], "f": "77a867a1"}, {"t": "怎么更新它", "n": "只要项目动了就更新「现在」那一节和对应的细节分支，然后重建页面。规矩已写进 `plan.md` 第 0.1 节：每条腿报告那一步顺手更新本图。**「现在」过期比没有图更糟**", "g": [], "s": "plan.md 第 0.1 节", "c": [], "f": "bb133c76"}, {"t": "反馈存在哪里", "n": "存在您的浏览器里，按页面的 `id` 为键。页面是单文件，没有服务器，也不联网。换浏览器就看不到之前写的意见，所以建议用「复制给 AI」把意见贴进对话", "g": [], "s": "outline-format.md", "c": [], "f": "b29adabe"}], "f": "d013f83f"}], "f": "f5a09917"}</script>

<script id="replies" type="application/json">[{"id": "F1018-052736-tq", "ts": "2026-10-18 05:28:47", "text": "同意，这条从「问题和风险」挪到「以后再做」，标成待做，不排期。\n\n理由说清楚：它不在关键路径上——计划里没有任何一项用到 TFSF 光源。而且它不是研究题，是尺寸题：三次拒绝都不是因为「二维不支持」，而是那个盒子自己的几何要求塞不进小格子（四边都要 PML、PML 之间至少留 5 格、每个面到 PML 至少留 2 格内格、监视器不能伸进 PML）。要的是一个大约宽三倍的格子。\n\n所以它现在的状态是：已知、成因写清、不紧急、等以后要真二维的 TFSF 时再花那点尺寸工夫。", "orig": "暂时先不急", "summary": "同意，已挪到「以后再做」并标为待做：它不在关键路径上，而且是尺寸题不是研究题。", "status": "done", "nodes": ["现在全貌 › 现在 › 以后再做 › TFSF 在真二维里还缺"], "rid": "2fc43112b9"}, {"id": "F1018-052726-8d", "ts": "2026-10-18 05:41:15", "text": "更正：这条原来是我标成「要你定」的，现在已经不是了——您在下面那条里直接给了答案。\n\n原本的解释保留价值不大，改记结论：**Q4 定为方案 B**，放弃厂商网格对齐、改用本项目自己的收敛判据。理由由您给出：REA 那边已经有比较清楚的网格生成方式，不需要再跑厂商软件；而且网格对精度的影响不算大。\n\n节点位置也改了：从「要你定的」移到「最近做完的」。", "orig": "解释下", "summary": "更正：Q4 已由您作答（选 B），节点移到「最近做完的」。", "status": "done", "nodes": ["现在全貌 › 发展历程 › 10-18 › 06:00 起，含 10-19 凌晨 › Q4 已定：放弃厂商网格对齐"], "rid": "0c4adba20b"}, {"id": "F1018-053402-wn", "ts": "2026-10-18 05:41:15", "text": "收到，Q4 记为**方案 B**：放弃厂商网格对齐，改用本项目自己的收敛判据。您的理由已原话记进 plan.md 第 6 节：REA 那边已经有比较清楚的网格生成方式，不必再跑厂商软件；网格对精度的影响不算大。\n\n**您那条观察我单独记成了一个待测问题，没有当成结论。** 原因是它和记录里的数字**问的不是同一件事**：\n\n- 记录里的说法是「渐变网格在**同域**测试里省 58.8% 的格子」——同一个盒子，用更少的格子来表示。\n- 您的观察是「**同精度**下非均匀网格没比均匀网格省格子」。\n\n同域省格子，不等于同精度省格子。两个说法可以同时成立，所以我没有删掉 58.8%，也没有把它改成错的，只是给它加了一个标签：**仅同域**。\n\n真正有意义的问题（同精度省不省格子）到现在没测过——这正好是 M10 登记要回答的事。它现在的状态是：已知、成因写清、**待测**。等哪天做 M10 或者做 M2 的时候顺手量一次，就有答案了。", "orig": "我们在rea里已经有相对比较清楚的网格生成方式了 而且这个其实对精度的影响不算太大 唯一值得注意的是：我们的非均匀网格似乎相比较均匀网格没有节省网格数量", "summary": "Q4 记为您选 B。您那条「非均匀不省格子」我记成待测问题——它和记录里的 58.8% 问的不是同一件事（同域 vs 同精度）。", "status": "done", "nodes": ["现在全貌 › 现在 › 问题和风险 › 非均匀网格省不省格子，两个说法对不上", "现在全貌 › 发展历程 › 10-18 › 06:00 起，含 10-19 凌晨 › Q4 已定：放弃厂商网格对齐"], "rid": "095677bb29"}, {"id": "F1018-053719-ln", "ts": "2026-10-18 05:41:15", "text": "解释在这里，两个词都是大白话。\n\n**主设备**＝反推结构要针对**哪个器件**来做。本项目的器件都只是测试载体，手上有好几个：光栅耦合器、光纤那个器件、还有二维缩短版。反推的工作是「给定一个想要的效果，倒过来算出结构长什么样」——所以得先指定**倒推哪一个器件**，否则不知道在优化什么。计划文件里的停止条件写的是：没有主设备就不开工。\n\n**主光腰**＝照上去的那束光 018-061849-acp-exec |\n| 14 | 光栅单级次 + 平板模式两个解析算例 | src/analytic_cases.py | 20261018-061852-acp-exec |\n\n每一条都拿到同样的三条约束：**只能写自己那一列的文件**、**提交时只 git add 自己的文件（不许 git add -A）**、**看到不属于自己的改动不要动**。GPU 跑由排他锁串行化，抢不到的等 30 秒重试，不许删锁。\n\n## 三腿各自要交什么\n\n- **腿 12**：接线修复（不许拿存储的通过标志当依据）+ 非空闭合盒守恒，带负对照（故意有损的盒子必须失败）。\n- **腿 13**：每个数字声明自己的读取平面、跨度、归一化；那 5.6 个百分点**要么界住、要么明确声明无界**（声明无界是合法结果）。论文是参考不是权威，差异先归因。\n- **腿 14**：两个算例都从引用到的定律重算，跑之前先声明适用范围，范围对不上就丢掉不近似。**做不成一个不算失败，谎称做成了才算。**\n\n## 每条腿的最后一道判据是算术的\n\n三条腿的 C6 都一样：**重跑覆盖率盘点，看它们声称覆盖的字段有没有真的离开 open 列表。** 说不动的，数字会说话。\n\n三条都是长活（预计一小时上下），结果落在各自 dispatch/claude/\u003crun id>/result.md。", "orig": "多派几个腿并行去做", "summary": "收到：三条腿并行派出，按文件切成互不重叠的三份。run id 与各自独占的文件见下。", "status": "done", "nodes": ["现在全貌 › 现在 › 要你定的 › 已定：三条腿并行，不再三选一"], "rid": "addc4a77e3"}, {"id": "F1018-061713-n0", "ts": "2026-10-18 20:37:01", "text": "三条腿全部跑完、收割、验收、提交，收尾也做完了。\n\n## 三条腿各自的结果\n\n| 腿 | 判决 | 事实 |\n|---|---|---|\n| 12 修接线 + 非空闭合盒 | **partial** | 接线修好了（当场重算、逼位相同才给标签；39 个运行的报告只有第 2 条腿那次变）。**非空闭合盒没闭合**：实测残差 7.5e-7，声明容差 1e-12，差 5 个数量级，原因未查明；故意做坏的负对照按预期失败（0.34） |\n| 13 读数口径账本（S4） | **accepted** | 48 对 48 全有定义（0 缺/0 非法/0 未知），207 次监视器几何重建核对 0 处不符；控制组全过：T+R=1 接口 4.57e-08、平板 7.51e-07（下限 1e-06），对称源 0.99999996 对 1.000x，单向源负对照 1.49e+13 按预期失败。5.6 个百分点那项**声明无界** |\n| 14 两个新解析算例 | **accepted** | 光栅零级效率余量 18.2 倍，平板 TM0 余量 2.00 倍；四个负对照全按预期失败 |\n\n## 一个执行事故，如实记着\n\n13 的 GPU 控制组当时**抢不到锁**（14 占着），执行者就停下来等；接着 07:02 桌面整理把项目搬进 paper-reproduction/，它的会话直接断了。所以 13 的收尾（跑控制组、填证据文件、提交）是主会话补做的。跑起来又暴露三个缺陷（NumPy 布尔值序列化失败、四个控制记账字段未分类、盘点工具把账本自己的计数器当物理量），都已修好并写进提交信息。\n\n## 覆盖率从 4/25 走到 8/25\n\n三条腿之后重跑盘点：读 40 个运行、106 类字段，**未覆盖的物理量只剩 1 个**（zero_order_forward_power），「有检验但没授予」和「未分类」都是 0。六个字段从 open 走到 settled —— **钉住口径不等于物理检验**，所以没有任何数字因为这件事变成 verified。\n\n## 我替它们做的两个决定，你可以在推翻\n\n1. C6 那道「算术判据」要改分类表（src/coverage_audit.py），而那张表不在任何一条腿的可写范围内。我把三条腿量出来的结果写进去了，包括六行 open→settled。\n2. 第 12 条腿报出 energy_spread 的登记前提本身就错了（它是已搁置的斜入射路线的量，不是闭合盒守恒量），所以它改成 settled 并写明原因。\n\n现在工作树是干净的，所有运行记录和 dispatch 记录都进了 git。挡路的是那个 7.5e-7   let s = I18N[key];
  if (s && typeof s === 'object') s = (v && v.n === 1) ? s.one : s.other;
  s = s == null ? key : String(s);

let groupSize = {};
function threadCard(tt, g){
  const l = lastRep(tt), isNew = tt.reps.some(r => !read[r.rid]);
  const mine = tt.kind === 'local';
  const sm = l ? sumOf(l) : t('you_prefix') + firstLine(tt.text);
  const stat = l ? l.status : '';
  const head = `<summary>${statusPill(stat, !l)}<span class="sm">${esc(sm)}</span>${isNew ? `<span class="nw">${esc(t('mk_new'))}</span>` : ''}<span class="tm">${esc(st5(l ? l.ts : tt.ts))}</span></summary>`;
  const qs = (tt.quotes || []).map(qHtml).join('');
  const ctx = !(tt.quotes || []).length && tt.ctx && tt.ctx.length > 1 ? `<div class="fc">${esc(t('item_ctx', {x: tt.ctx[tt.ctx.length - 1]}))}</div>` : '';
  const longTxt = (tt.text || '').length > 90;

      + (r.status === 'needs-you' && r.ask ? `<div class="askq">${esc(r.ask)}</div>` : '')
      + (det ? `<details class="dt" data-ok="dt:${esc(r.rid)}"><summary>${esc(r.summary ? t('detail_label') : t('detail_rest'))}</summary><div class="dtx">${esc(det)}</div></details>` : '')
      + (nds ? `<div class="ncs">${nds}</div>` : '') + `</div>`;

  let st = '';

  if (mine) acts.push(`<span class="act" data-act="edit" data-id="${esc(tt.id)}" title="${esc(t('act_edit_title'))}">${esc(t('act_edit'))}</span><span class="act" data-act="del" data-id="${esc(tt.id)}" title="${esc(t('act_del_title'))}">${esc(t('act_del'))}</span>`);
  const cls = 'th' + (g === 'new' ? ' isnew' : g === 'ask' ? ' isask' : g === 'wait' ? ' iswait' : '');
  const open = g === 'ask' || ((g === 'new' || g === 'wait') && (groupSize[g] || 0) <= 3);
  return `<details class="${cls}" data-th="${esc(tt.id)}" data-ok="th:${esc(tt.id)}" ${open ? 'open' : ''}>${head}<div class="body">${you}${reps}${st}<div class="ft"><span class="fc">${esc(hm(tt.ts))}</span><span class="grow"></span>${acts.join('')}</div></div></details>`;
}
function nodeAskCard(n){
  return `<div class="ndcard" data-nid="${n.id}"><div class="ct">${statusPill('needs-you')}${esc(n.t)}</div>${n.n ? `<div class="cn">${esc(n.n)}</div>` : ''}<div class="ft"><span class="fc">${esc(crumbOf(n))}</span><span class="grow"></span><span class="act" data-act="nodedone" data-nid="${n.id}" title="${esc(t('act_dismiss_title'))}">${esc(t('act_dismiss'))}</span><span class="act pri" data-act="quote" data-nid="${n.id}">${esc(t('act_reply'))}</span></div></div>`;

const emptyHtml = () => `<div class="empty"><p><b>${esc(t('empty_lead'))}</b>${esc(t('empty_p1'))}</p><p>${esc(t('empty_p2'))}</p><p>${esc(t('empty_p3'))}</p></div>`;
function captureOpen(){ const s = new Set(); fbl.querySelectorAll('[data-ok][open]').forEach(e => s.add(e.dataset.ok)); return s; }
function render(){
  const openSet = captureOpen(), hadList = fbl.children.length > 0, scroll = fbl.scrollTop;
  threads = buildThreads();
  SETS = computeSets();
  const groups = {ask: [], new: [], wait: [], done: []};
  threads.forEach(tt => groups[groupOf(tt)].push(tt));
  groupSize = {ask: groups.ask.length, new: groups.new.length, wait: groups.wait.length};
  const lastKey = tt => (lastRep(tt) ? lastRep(tt).ts : tt.ts).slice(0, 16);
  groups.ask.sort((a, b) => (lastKey(a) < lastKey(b) ? 1 : lastKey(a) > lastKey(b) ? -1 : (a.ts < b.ts ? -1 : 1)));
  groups.new.sort((a, b) => (lastKey(a) < lastKey(b) ? 1 : lastKey(a) > lastKey(b) ? -1 : (a.ts < b.ts ? -1 : 1)));
  let h = '';
  const nAsk = groups.ask.length + SETS.nodeAsks.length;
  if (nAsk) h += `<div class="sec ask"><div class="sh">${esc(t('con_ask'))}<span class="c">${nAsk}</span></div><div class="sech">${esc(t('sec_ask_hint'))}</div>${groups.ask.map(tt => threadCard(tt, 'ask')).join('')}${SETS.nodeAsks.map(nodeAskCard).join('')}</div>`;
  if (groups.new.length) h += `<div class="sec new"><div class="sh">${esc(t('con_new'))}<span class="c">${SETS.newReps.length}</span><span class="sa" data-act="readall">${esc(t('sec_readall'))}</span></div>${groups.new.map(tt => threadCard(tt, 'new')).join('')}</div>`;
  if (groups.wait.length) h += `<div class="sec"><div class="sh">${esc(t('sec_wait'))}<span class="c">${groups.wait.length}</span></div>${groups.wait.map(tt => threadCard(tt, 'wait')).join('')}</div>`;
  if (groups.done.length){
    const byDate = {};
    groups.done.forEach(tt => { const d = lastRep(tt).ts.slice(0, 10); (byDate[d] = byDate[d] || []).push(tt); });

  fbl.scrollTop = scroll;
  observeNew();

  const fresh = items.filter(i => !i.sent && !threads.some(tt => tt.id === i.id && tt.reps.length)).length;   // not copied yet and not replied to yet
  $('fbn').textContent = fresh ? t('btn_copy_new', {n: fresh}) : t('btn_copy');

// Seen counts as read: a new reply that stays visible in the right panel for 2 seconds becomes read
function markRead(fid){
  const tt = threads.find(x => x.id === fid); if (!tt) return;
  let ch = false; tt.reps.forEach(r => { if (!read[r.rid]){ read[r.rid] = nowTs(); ch = true; } });
  if (!ch) return;
  lsSet('read', read);
  const el = fbl.querySelector(`.th[data-th="${CSS.escape(fid)}"]`); if (el) el.classList.add('seen');
  refreshAfterRead();
}
function refreshAfterRead(){
  fbl.querySelectorAll('.th.isnew').forEach(el => { const tt = threads.find(x => x.id === el.dataset.th); if (tt && !tt.reps.some(r => !read[r.rid])) el.classList.add('seen'); });
  markNodes(); updateConsole();
}
let io = null; const dwellTm = new Map();
function observeNew(){
  if (io) io.disconnect(); dwellTm.forEach(clearTimeout); dwellTm.clear();
  if (!('IntersectionObserver' in window)) return;
  io = new IntersectionObserver(es => es.forEach(en => {
    const el = en.target;
    if (en.isIntersecting && en.intersectionRatio >= 0.5){
      if (!dwellTm.has(el)) dwellTm.set(el, setTimeout(() => { dwellTm.delete(el); if (document.visibilityState === 'visible') markRead(el.parentElement.dataset.th); }, 2000));
    } else if (dwellTm.has(el)){ clearTimeout(dwellTm.get(el)); dwellTm.delete(el); }
  }), {root: fbl, threshold: [0, 0.5, 1]});
  fbl.querySelectorAll('.th.isnew > summary').forEach(s => io.observe(s));   // watch the title row of every new-reply card
}

function focusThread(fid){
  setFold(false);
  let el = fbl.querySelector(`.th[data-th="${CSS.escape(fid)}"]`);
  if (!el) return;
  for (let e = el.parentElement; e && e !== fbl; e = e.parentElement) if (e.tagName === 'DETAILS') e.open = true;
  el.open = true; el.scrollIntoView({block: 'center'});
  el.classList.remove('flashth'); void el.offsetWidth; el.classList.add('flashth');
}
fbl.addEventListener('click', e => {
  const sm = e.target.closest('.th > summary');
  if (sm){ const th = sm.parentElement; if (th.classList.contains('isnew') && !th.open) markRead(th.dataset.th); }   // opening a new-reply card counts as seen too
  const more = e.target.closest('[data-more]'); if (more){ const y = more.parentElement.querySelector('.yt'); y.classList.toggle('exp'); more.textContent = y.classList.contains('exp') ? t('more_less') : t('more_full'); return; }
  const a = e.target.closest('[data-act]');
  if (a){ e.preventDefault(); act(a.dataset.act, a.dataset.id, a.dataset.nid); return; }
  if (goKey(e)) return;
  const nc = e.target.closest('.ndcard'); if (nc && !e.target.closest('.act')){ goNode(byId[nc.dataset.nid], true); }
});

function newId(){ const d = new Date(); return `F${pad(d.getMonth() + 1)}${pad(d.getDate())}-${pad(d.getHours())}${pad(d.getMinutes())}${pad(d.getSeconds())}-${Math.random().toString(36).slice(2, 4)}`; }
function submit(){
  const text = fbt.value.trim();
  if (!text){ toast(quotes.length ? t('toast_need_text_quoted') : t('toast_need_text')); fbt.focus(); return; }
  const it = {id: newId(), ts: nowTs(), quotes, text, ctx: sel ? titles(sel) : null, sent: null, replaces};
  if (replyTo){ it.re = replyTo.fid; answered[replyTo.rid] = nowTs(); lsSet('answered', answered); }
  items.push(it);
  saveItems();
  quotes = []; replaces = null; replyTo = null; fbt.value = ''; renderChips(); saveDraft(); grow(); render();
  focusThread(it.id);
}
function act(kind, id, nid){
  if (kind === 'readall'){ threads.forEach(tt => tt.reps.forEach(r => { read[r.rid] = nowTs(); })); lsSet('read', read); refreshAfterRead(); return; }
  if (kind === 'quote'){ const n = byId[nid]; if (n){ showPanel(n); addQuote(n, ''); } return; }
  if (kind === 'nodedone'){ const n = byId[nid]; if (n){ ansNode[n.kid] = n.f; lsSet('ansnode', ansNode); render(); } return; }
  if (kind === 'reply' || kind === 'dismiss'){
    const tt = threads.find(x => x.id === id); const l = tt && lastRep(tt); if (!l) return;
    if (kind === 'dismiss'){ answered[l.rid] = nowTs(); lsSet('answered', answered); render(); return; }
    replyTo = {fid: tt.id, rid: l.rid, ask: l.ask || sumOf(l)};
    tt.nodeKeys.forEach(k => { const n = byKey[k]; if (n && !quotes.some(qq => keyOf(qq.p) === k && !qq.x)) quotes.push({p: titles(n), x: ''}); });
    renderChips(); saveDraft(); setFold(false); fbt.focus(); return;
  }
  const it = items.find(x => x.id === id);
  if (!it){ return; }
  if (kind === 'del' && it.sent && !confirm(t('confirm_delete_sent'))) return;
  items = items.filter(x => x.id !== id); saveItems();
  delIds.add(id); lsSet('del', [...delIds]);
  if (kind === 'edit'){
    (it.quotes || []).forEach(qq => { if (!quotes.some(x => keyOf(x.p) === keyOf(qq.p) && x.x === qq.x)) quotes.push(qq); });
    fbt.value = it.text + (fbt.value.trim() ? '\n' + fbt.value : '');
    if (it.sent) replaces = it.id; else if (it.replaces) replaces = it.replaces;
    renderChips(); saveDraft(); grow(); fbt.focus();
  }
  render();
}
function exportText(list){
  const L = [t('export_head', {title: META.title, n: list.length})];
  if (META.file) L.push(t('export_file', {file: META.file}));
  if (META.reply_cmd) L.push(t('export_reply', {cmd: META.reply_cmd}));
  L.push('');
  list.forEach((it, i) => {
    L.push(`${i + 1}. [${it.id}] ${hm(it.ts)}` + (it.replaces ? t('export_revises', {id: it.replaces}) : '') + (it.re ? t('export_answers', {id: it.re}) : ''));
    (it.quotes || []).forEach(q => L.push('   ' + t('export_quote', {path: keyOf(q.p.slice(1)) || q.p[0]}) + (q.x ? '\n         ' + t('export_quote_text', {x: q.x}) : t('export_quote_whole'))));
    if (!(it.quotes || []).length && it.ctx && it.ctx.length > 1) L.push('   ' + t('export_noquote', {path: keyOf(it.ctx.slice(1))}));
    L.push('   ' + t('export_says') + it.text.replace(/\n/g, '\n      '), '');
  });
  return L.join('\n');
}
async function copyText(text){
  try { await navigator.clipboard.writeText(text); return true; } catch (_) {}
  try {
    const ta = document.createElement('textarea'); ta.value = text; ta.style.cssText = 'position:fixed;left:-9999px;top:0';
    document.body.appendChild(ta); ta.select(); const ok = document.execCommand('copy'); ta.remove(); return ok;
  } catch (_) { return false; }
}
let toMark = [];
function markSent(list){ const ts = nowTs(); list.forEach(it => { it.sent = it.sent || ts; }); saveItems(); render(); }
async function copyOut(all){
  if (fbt.value.trim() && confirm(t('confirm_submit_first'))) submit();
  const list = items.filter(i => all || (!i.sent && !REPLIES.some(r => r.id === i.id)));
  if (!list.length){ toast(items.length ? t('toast_all_copied') : t('toast_no_feedback')); return; }
  const tt = exportText(list);
  if (await copyText(tt)){ markSent(list); toast(t('toast_copied', {n: list.length})); return; }
  toMark = list; $('cpt').value = tt; $('cpm').classList.add('open'); $('cpt').focus(); $('cpt').select();
}
$('cpok').onclick = () => { markSent(toMark); toMark = []; $('cpm').classList.remove('open'); };
$('cpx').onclick = () => { toMark = []; $('cpm').classList.remove('open'); };
$('fbs').onclick = submit;
$('fbn').onclick = () => copyOut(false);
$('fba').onclick = e => { e.preventDefault(); copyOut(true); };
fbt.addEventListener('keydown', e => { if (e.key === 'Enter' && (e.metaKey || e.ctrlKey) && !e.isComposing){ e.preventDefault(); submit(); } });
fbt.addEventListener('input', () => { grow(); clearTimeout(fbt.tm); fbt.tm = setTimeout(saveDraft, 300); });
window.addEventListener('storage', e => { if (e.key === NS + 'items'){ items = lsGet('items', []); render(); } else if (e.key === NS + 'read'){ read = lsGet('read', {}); refreshAfterRead(); } });

// Quote selected text (works in the details, the outline and the feedback list)
const selq = $('selq'); let selInfo = null;
document.addEventListener('mouseup', e => setTimeout(() => {
  if (e.target.closest && e.target.closest('#selq')) return;
  const s = window.getSelection(), txt = s.toString().trim();
  if (!txt || !s.rangeCount){ selq.style.display = 'none'; selInfo = null; return; }
  const a = s.anchorNode, el = a && (a.nodeType === 1 ? a : a.parentElement);
  let n = null;
  if (!el) return;
  if (el.closest('#pc')) n = sel;
  else if (el.closest('#outline')){ const o = el.closest('details,.leaf'); const h = o && o.querySelector(':scope > summary > [data-oid], :scope > [data-oid]'); n = h && byId[h.dataset.oid]; }
  else if (el.closest('.qb')) n = findKey(el.closest('.qb').dataset.key);
  if (!n){ selq.style.display = 'none'; selInfo = null; return; }
  const r = s.getRangeAt(0).getBoundingClientRect();
  selq.style.display = 'block';
  selq.style.left = Math.max(8, Math.min(window.innerWidth - 110, r.left + r.width / 2 - 45)) + 'px';
  selq.style.top = (r.top > 44 ? r.top - 34 : r.bottom + 6) + 'px';
  selInfo = {n, x: txt.slice(0, 3000)};
}, 0));
selq.addEventListener('mousedown', e => e.preventDefault());
selq.onclick = () => { if (selInfo) addQuote(selInfo.n, selInfo.x); selq.style.display = 'none'; selInfo = null; window.getSelection().removeAllRanges(); };

// Fold and resize
function setFold(f){
  document.body.classList.toggle('fbc', f); lsSet('fold', f); fitHeader();
}
$('ffold').onclick = () => setFold(true);
$('fv').onclick = () => setFold(false);
function setW(w){ w = Math.max(320, Math.min(760, w)); document.documentElement.style.setProperty('--fbw', w + 'px'); lsSet('w', w); fitHeader(); }
let rz = null;
$('rz').addEventListener('pointerdown', e => { if (document.body.classList.contains('fbc')) return; rz = true; $('rz').setPointerCapture(e.pointerId); e.preventDefault(); });
$('rz').addEventListener('pointermove', e => { if (rz) setW(window.innerWidth - e.clientX); });
$('rz').addEventListener('pointerup', () => { rz = null; });

// ===== Header: update time, new-version notice, legend, help =====
$('legend').innerHTML = esc(t('legend_prefix')) + TAGS.map(g => `<span class="tag tag-${g}">${esc(tagLabel(g))}</span>`).join('') + '\u3000' + `<span class="mk on">${esc(t('mk_new'))}</span><span class="mk on">${esc(t('mk_chg'))}</span>` + esc(t('legend_suffix'));
$('ffold').textContent = t('fb_fold');
$('hleg').onclick = () => { $('legend').classList.toggle('open'); fitHeader(); };
$('hhelp').onclick = () => { $('hmeta').classList.toggle('open'); fitHeader(); };
function fitHeader(){ document.documentElement.style.setProperty('--hh', $('hdr').offsetHeight + 'px'); if (popKind){ const r = $('cons').getBoundingClientRect(); $('pop').style.top = (r.bottom + 6) + 'px'; } }
function ageText(){
  const m = /^(\d+)-(\d+)-(\d+) (\d+):(\d+)/.exec(META.stamp); if (!m){ $('age').textContent = ''; return; }
  const tt = new Date(+m[1], m[2] - 1, +m[3], +m[4], +m[5]).getTime(), mins = Math.max(0, Math.round((Date.now() - tt) / 60000));
  const rel = mins < 2 ? t('age_just') : mins < 60 ? t('age_min', {n: mins}) : mins < 1440 ? t('age_h', {n: Math.round(mins / 60)}) : t('age_d', {n: Math.round(mins / 1440)});
  $('age').textContent = t('age_line', {stamp: META.stamp.slice(5), rel});
}
ageText(); setInterval(() => { ageText(); if (SETS) updateConsole(); }, 60000);
function checkNew(){
  if (!META.stamp_js || document.visibilityState !== 'visible') return;
  const s = document.createElement('script'); s.src = META.stamp_js + '?t=' + Date.now();
  s.onload = () => { const L = window.__MM_LATEST; if (L && L.stamp_full && L.stamp_full !== META.stamp_full){ $('newver').classList.add('on'); fitHeader(); } s.remove(); };
  s.onerror = () => s.remove();
  document.head.appendChild(s);
}
$('newver').onclick = () => { onLeave(); location.reload(); };
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') checkNew(); });
setInterval(checkNew, 180000);

// ===== Keep your place when the same tab is refreshed =====
function saveView(){
  clearTimeout(saveView.tm);
  saveView.tm = setTimeout(() => {
    ssSet({lv: curLv, f: filter, sel: sel ? sel.kid : '', o: document.body.classList.contains('outline'), tx, ty, z: zoom, fold: document.body.classList.contains('fbc'),
      exp: ALL.filter(n => n.c.length && !n.el.classList.contains('collapsed')).map(n => n.kid), t: Date.now()});
  }, 250);
}
function restoreView(){
  const v = ssGet(); if (!v || !v.exp) return false;
  const byKid = {}; ALL.forEach(n => { byKid[n.kid] = n; });
  curLv = v.lv || 2;
  const ex = new Set(v.exp);
  ALL.forEach(n => { if (n.c.length) n.el.classList.toggle('collapsed', !ex.has(n.kid)); });
  document.querySelectorAll('[data-lv]').forEach(b => b.classList.toggle('on', +b.dataset.lv === curLv));
  if (v.f && PRED[v.f]) setFilter(v.f, true);
  if (v.o) toggleOutline(true);
  zoom = v.z || 1; tx = v.tx || 0; ty = v.ty || 0; apply();
  if (v.sel && byKid[v.sel]) showPanel(byKid[v.sel]);
  return true;
}

// ===== Opening =====
const w0 = lsGet('w', 0); if (w0) document.documentElement.style.setProperty('--fbw', w0 + 'px');
if (lsGet('fold', false)) document.body.classList.add('fbc');
fitHeader(); window.addEventListener('resize', fitHeader);
render(); renderChips(); grow();
if (!restoreView()){ setLevel(2); document.querySelectorAll('#outline details').forEach(d => { d.open = +d.className.slice(2) < 2; }); fitHeader(); homeNow(false); }
map.classList.remove('anim');
setTimeout(checkNew, 1500);
if (!filter) document.querySelector('[data-f=""]').classList.add('on');
window.__mm = {onLeave, state: () => ({chg: [...chg.entries()].map(([n, v]) => [n.key, v]), read, answered, snapTs}), threads: () => threads, sets: () => SETS, filter: () => filter};
})();
</script>
